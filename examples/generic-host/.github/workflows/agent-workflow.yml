name: Agent Workflow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Check initialized host files
        run: npm run workflow:init:check
      - name: Check Agent bridges
        run: npm run workflow:setup:check
      - name: Check active Profile
        run: npm run workflow:profile
      - name: Check context budgets
        run: npm run workflow:context
      - name: Run workflow policy gates
        run: npm run quality:policy
